# Runs on every pull request and every push to main. A pull request can only
# be merged when this passes (turn on "Require status checks" for main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, translations, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the lint step can see what this pull request
          # changed compared with the branch it targets.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      # Only the files this pull request adds or changes: new code must be
      # lint-clean, while older files with known problems don't block anyone
      # until they're touched. (`npx eslint .` still lists everything.)
      - name: Lint (files changed in this pull request)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' | grep -v '^src/_unused/' || true)
          if [ -z "$files" ]; then
            echo "No TypeScript files changed."
            exit 0
          fi
          echo "$files"
          npx eslint --no-warn-ignored $files

      - name: Translations (no duplicate or missing keys)
        run: node scripts/check-i18n.mjs

      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist.
          # Real keys never go in CI or in the repository.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
